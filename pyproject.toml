[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentcompile"
version = "0.1.0"
description = "Wrap your agent's model client: repeated jobs run compiled, everything else goes to your model unchanged."
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
authors = [{ name = "AgentCompile", email = "founders@tryagentcompile.com" }]
classifiers = ["Development Status :: 3 - Alpha", "Programming Language :: Python :: 3", "Intended Audience :: Developers", "Topic :: Software Development :: Libraries"]

dependencies = ["httpx>=0.25"]

[project.urls]
Homepage = "https://tryagentcompile.com"

[project.optional-dependencies]
openai = ["openai>=1.0"]
anthropic = ["anthropic>=0.40"]
dev = ["pytest>=8", "openai>=1.0", "anthropic>=0.40", "pytest-asyncio>=0.23"]

[project.scripts]
agentcompile = "agentcompile.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/agentcompile"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 96
target-version = "py39"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "C4", "RUF"]
