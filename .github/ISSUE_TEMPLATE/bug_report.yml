name: Bug report
description: Something in the SDK doesn't work as documented
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations: { required: true }
  - type: textarea
    id: repro
    attributes:
      label: Minimal code to reproduce
      render: python
  - type: input
    id: versions
    attributes:
      label: Versions
      placeholder: agentcompile 0.2.0, openai 2.x, Python 3.12
  - type: textarea
    id: trail
    attributes:
      label: Trail lines (`agentcompile trail --json`), with secrets removed
