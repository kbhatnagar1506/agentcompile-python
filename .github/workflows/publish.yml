# Publishes to PyPI when a version tag (v0.1.1, ...) is pushed. Uses PyPI trusted publishing:
# add this repo and workflow (publish.yml, environment "pypi") as a trusted publisher on the
# agentcompile project at pypi.org, so no token is stored here.
name: Publish
on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build && python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
