# Releases. On every push to main, release-please keeps a "release PR" open that bumps the
# version and writes CHANGELOG.md from conventional commits (feat: -> minor, fix: -> patch,
# feat!: -> major). Merging that PR tags vX.Y.Z and this workflow publishes to PyPI.
# A tag pushed by hand (git tag v0.2.0 && git push --tags) publishes too.
#
# PyPI trusted publishing: owner kbhatnagar1506, repo agentcompile-python, workflow
# release.yml, environment pypi. No token is stored here.
name: Release
on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      released: ${{ steps.rp.outputs.release_created }}
      tag: ${{ steps.rp.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: rp
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    needs: [release-please]
    # Runs after a release-please release on main, or for a tag pushed by hand.
    if: always() && (needs.release-please.outputs.released == 'true' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag || github.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build && python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
